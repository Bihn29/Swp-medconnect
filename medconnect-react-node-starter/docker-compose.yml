version: '3.9'
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medconnect
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  backend:
    build: ./backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/medconnect?schema=public
      - JWT_SECRET=devsecret
      - PORT=4000
      - CORS_ORIGIN=http://localhost:5173
    ports:
      - "4000:4000"
    depends_on:
      - db
    working_dir: /app
    command: sh -c "npx prisma generate && npx prisma migrate deploy || npx prisma migrate dev --name init && npm run dev"
    volumes:
      - ./backend:/app
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm i && npm run dev -- --host"
    depends_on:
      - backend
volumes:
  pgdata:
